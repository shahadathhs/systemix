name: Release (NPM)

on:
  push:
    branches:
      - main

jobs:
  release-npm:
    name: Build, Version & Publish
    runs-on: ubuntu-latest

    # contents/pull-requests: changesets Version PR flow
    # id-token: npm Trusted Publishing (OIDC) — no NPM_TOKEN secret
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write

    if: github.event.repository.fork == false

    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          scope: '@systemix'

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # npm >= 11.5 is required for Trusted Publishing (OIDC)
      - name: Check npm version
        run: |
          npm install -g npm@^11
          npm -v

      # Install Dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build packages
      - name: Build project
        run: pnpm build

      # Version + Publish via Changesets (publishing uses npm OIDC)
      - name: Version & Publish Packages
        uses: changesets/action@v1
        with:
          # `pnpm run version` formats the generated CHANGELOGs per package.
          # Plain `changeset version` formats from the repo root, where
          # .prettierignore excludes the workspaces, so it silently skipped them.
          version: pnpm run version
          publish: node scripts/publish-npm.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
